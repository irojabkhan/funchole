spring:
  application:
    name: funchole-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/funchole}
    username: ${DB_USERNAME:funchole}
    password: ${DB_PASSWORD:funchole}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: funchole-mcp-server
        version: ${APP_VERSION:0.1.0-SNAPSHOT}
        instructions: >
          FuncHole lets you create Functions, compose them into Flows, expose
          Flows as HTTP routes through a Gateway, and attach shared
          environment/secret/database resources - all through these tools
          instead of the REST API directly.
        streamable-http:
          mcp-endpoint: /api/mcp

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

server:
  port: ${SERVER_PORT:7080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    flyway:
      access: read_only
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: FuncHole backend bootstrap API
    version: ${APP_VERSION:0.1.0-SNAPSHOT}

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.flyway.autoconfigure: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  nats:
    url: ${NATS_URL:nats://localhost:4222}
  source:
    storage-root: ${SOURCE_STORAGE_ROOT:/tmp/funchole-sources}
  artifact:
    endpoint: ${S3_ARTIFACT_ENDPOINT:http://localhost:9000}
    bucket: ${S3_ARTIFACT_BUCKET:funchole-artifacts}
    access-key: ${S3_ARTIFACT_ACCESS_KEY:funchole}
    secret-key: ${S3_ARTIFACT_SECRET_KEY:funchole-secret}
    region: ${S3_ARTIFACT_REGION:us-east-1}
    path-style-access: ${S3_ARTIFACT_PATH_STYLE_ACCESS:true}
  certificate:
    provider: ${CERTIFICATE_PROVIDER:SELF_SIGNED}
    self-signed-validity-days: ${CERTIFICATE_SELF_SIGNED_VALIDITY_DAYS:30}
    retry-delay-ms: ${CERTIFICATE_RETRY_DELAY_MS:60000}
  security:
    jwt:
      secret: ${JWT_SECRET:ZGV2LXNlY3JldC1mb3ItZnVuY2hvbGUtYmFja2VuZC1jaGFuZ2UtbWUtYmVmb3JlLXByb2QteHl6MTIzNDU2Nzg5MDEyMw==}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    bootstrap-user:
      username: ${BOOTSTRAP_USERNAME:admin}
      password: ${BOOTSTRAP_PASSWORD:admin12345}
