<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #0a0a0c;
    overflow: hidden;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .wrap {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 90px;
  }
  .glow {
    position: absolute;
    top: -220px;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(245,166,35,0.16), transparent 70%);
  }
  .logo {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 48px;
  }
  .logo span {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 30px;
    color: #f5f5f0;
    letter-spacing: -0.01em;
  }
  h1 {
    position: relative;
    font-size: 68px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: #f5f5f0;
    margin-bottom: 28px;
    max-width: 950px;
  }
  h1 span { color: #f5a623; }
  p {
    position: relative;
    font-size: 26px;
    line-height: 1.5;
    color: #a3a19b;
    max-width: 780px;
  }
  .eyebrow {
    position: relative;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: #f5a623;
    margin-bottom: 18px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="glow"></div>
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="#f5f5f0" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="2.75" fill="#f5a623"/>
      </svg>
      <span>FuncHole</span>
    </div>
    <p class="eyebrow">MCP-NATIVE PLATFORM</p>
    <h1>Describe it.<br><span>Your agent ships it.</span></h1>
    <p>The platform built for AI coding agents — connect Claude Code, Codex, or any MCP client, and it creates, deploys, and fixes your backend itself.</p>
  </div>
</body>
</html>
